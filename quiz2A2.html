<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz A2-2 – Wende die binomischen Formeln an 2</title>
<style>
  :root{--bg:#f7f9fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--primary:#16a34a;--primary-d:#15803d;--link:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{max-width:900px;margin:18px auto 6px;padding:0 16px}
  .breadcrumbs{font-size:14px;color:var(--muted)}
  .breadcrumbs a{color:var(--link);text-decoration:none}
  h1{margin:6px 0 0;font-size:clamp(22px,4vw,34px)}
  main{max-width:900px;margin:8px auto 30px;padding:0 16px}
  .card{background:var(--card);border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.06);padding:16px}
  .q{padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin:10px 0;background:#fff}
  .q h3{margin:0 0 6px;font-size:18px}
  .line{color:#111;font-size:16px}
  .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  button{padding:8px 12px;border:none;border-radius:10px;background:var(--primary);color:#fff;cursor:pointer}
  button:hover{background:var(--primary-d)}
  .solution{display:none;margin-top:8px;padding:8px;background:#f8fafc;border-radius:8px}
  .footer-links{margin-top:14px}
  .footer-links a{color:var(--link);text-decoration:none}
</style>
</head>
<body>
  <header>
    <div class="breadcrumbs"><a href="../index.html">Start</a> · <a href="../arbeit2.html" onclick="history.back();return false;">8. Klasse – 2. Arbeit</a></div>
    <h1>Wende die binomischen Formeln an 2</h1>
  </header>

  <main>
    <div class="card" id="quiz"></div>
    <div class="footer-links"><a href="../arbeit2.html">Zur Übersicht</a></div>
  </main>

<script>
const DATA = [['(3x + 2)^2', '9x^2 + 12x + 4'], ['(4y − 1)^2', '16y^2 − 8y + 1'], ['(5z + 3)^2', '25z^2 + 30z + 9'], ['(7m − 2)^2', '49m^2 − 28m + 4'], ['(3t + 11)^2', '9t^2 + 66t + 121'], ['(6k − 7)^2', '36k^2 − 84k + 49'], ['(2 + 9t)^2', '81t^2 + 36t + 4'], ['(11 − 2a)^2', '4a^2 − 44a + 121'], ['(10 − 3b)^2', '9b^2 − 60b + 100'], ['(3r + 1/2)^2', '9r^2 + 3r + 1/4'], ['(2s − 1/5)^2', '4s^2 − 4/5 s + 1/25'], ['(10 − 5t)^2', '25t^2 − 100t + 100'], ['(2a − 5b)^2', '4a^2 − 20ab + 25b^2'], ['(8x + 9y)^2', '64x^2 + 144xy + 81y^2'], ['(4r − 7s)^2', '16r^2 − 56rs + 49s^2'], ['(4a + 3b)(4a − 3b)', '16a^2 − 9b^2'], ['(12x − 7y)(12x + 7y)', '144x^2 − 49y^2'], ['(11r − 2t)(11r + 2t)', '121r^2 − 4t^2'], ['(2y + 11x)(2y − 11x)', '4y^2 − 121x^2'], ['(5u − 1/2 v)(5u + 1/2 v)', '25u^2 − 1/4 v^2'], ['(5x − 1/4 y)(5x + 1/4 y)', '25x^2 − 1/16 y^2']];

function addQuestion(container, idx, left, solution){
  const div = document.createElement('div');
  div.className = 'q';
  const h = document.createElement('h3');
  h.textContent = `Aufgabe ${idx+1}`;
  div.appendChild(h);
  const line = document.createElement('div');
  line.className = 'line';
  line.textContent = left + ' = ___';
  div.appendChild(line);
  const btn = document.createElement('button');
  btn.textContent = 'Lösung anzeigen';
  btn.addEventListener('click', ()=>{
    sol.style.display = sol.style.display==='none' ? 'block' : 'none';
    btn.textContent = sol.style.display==='none' ? 'Lösung anzeigen' : 'Lösung ausblenden';
  });
  div.appendChild(btn);
  const sol = document.createElement('div');
  sol.className = 'solution';
  sol.textContent = 'Lösung: ' + solution;
  div.appendChild(sol);
  container.appendChild(div);
}

const container = document.getElementById('quiz');
DATA.forEach((row, i)=> addQuestion(container, i, row[0], row[1]));
</script>
</body>
</html>
